site_name: MyDevOps Docs
site_url: https://ezdanapak.github.io/MyDevOps/
site_description: DevOps Learning Project
repo_url: https://github.com/ezdanapak/MyDevOps
docs_dir: docs
site_dir: site
copyright: "Copyright © 2026 Giorgi Kapanadze"

theme:
  name: material
  language: ka
  font: false
  custom_dir: overrides
  features:
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tooltips
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
      # Dark Mode
      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        toggle:
          icon: material/weather-sunny
          name: Light mode
        primary: green
        accent: orange
      # Light Mode
      - media: "(prefers-color-scheme: light)"
        scheme: default
        toggle:
          icon: material/weather-night
          name: Dark mode
        primary: green
        accent: deep orange

  icon:
    icon:
      admonition:
        note: octicons/tag-16
        abstract: octicons/checklist-16
        info: octicons/info-16
        tip: octicons/squirrel-16
        success: octicons/check-16
        question: octicons/question-16
        warning: octicons/alert-16
        failure: octicons/x-circle-16
        danger: octicons/zap-16
        bug: octicons/bug-16
        example: octicons/beaker-16
        quote: octicons/quote-16

# Markdown Extensions (გაუციფრებული, დუბლების გარეშე)
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.keys:
      separator: "+"
  - toc:
      permalink: true
      separator: "_"
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - quiz/quiz.css
  - assets/css/academy.css

extra_javascript:
  - assets/js/vendor/mermaid/mermaid.min.js
  - quiz/data/linux.js
  - quiz/data/network.js
  - quiz/data/bash.js
  - quiz/data/git.js
  - quiz/data/nginx.js
  - quiz/data/docker.js
  - quiz/data/cicd.js
  - quiz/data/k8s.js
  - quiz/data/backup.js
  - quiz/data/cheatsheet.js
  - quiz/quiz.js
  - assets/js/progress.js
  - assets/js/app.js
  - assets/js/theme.js
  - assets/js/pwa-register.js

